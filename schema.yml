components:
  schemas:
    Assessment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        score:
          type: number
          format: double
          nullable: true
        risk_level:
          type: string
          nullable: true
          maxLength: 50
        status:
          allOf:
          - $ref: '#/components/schemas/AssessmentStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        org:
          type: integer
          readOnly: true
        vendor:
          type: integer
        template:
          type: integer
      required:
      - created_at
      - id
      - org
      - status
      - template
      - updated_at
      - vendor
    AssessmentStatusEnum:
      enum:
      - assigned
      - submitted
      - reviewed
      - approved
      type: string
      description: |-
        * `assigned` - Assigned
        * `submitted` - Submitted
        * `reviewed` - Reviewed
        * `approved` - Approved
    DecisionEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    Evidence:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        question_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        file:
          type: string
          format: uri
        file_type:
          type: string
          maxLength: 50
        expiry_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        assessment:
          type: integer
        uploaded_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - assessment
      - created_at
      - file
      - file_type
      - id
      - question_id
      - uploaded_by
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    PatchedAssessment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        score:
          type: number
          format: double
          nullable: true
        risk_level:
          type: string
          nullable: true
          maxLength: 50
        status:
          allOf:
          - $ref: '#/components/schemas/AssessmentStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        org:
          type: integer
          readOnly: true
        vendor:
          type: integer
        template:
          type: integer
    PatchedEvidence:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        question_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        file:
          type: string
          format: uri
        file_type:
          type: string
          maxLength: 50
        expiry_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        assessment:
          type: integer
        uploaded_by:
          type: integer
          readOnly: true
          nullable: true
    PatchedRemediation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        org_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        issue:
          type: string
        vendor_response:
          type: string
        status:
